  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  max_seq_length: 1024
  logging_steps: 10
  save_strategy: epoch
  seed: 42
  bf16: true
  fp16: false
evaluation:
  split: test
  max_eval_samples: 100
  max_new_tokens: 128
  temperature: 0.0
  do_sample: false
gradient_importance:
  max_calibration_samples: 64
  max_seq_length: 512
  max_spectral_rank: 64
  svd_niter: 4
adaptive_rank:
  avg_rank: 16
  min_rank: 2
  max_rank: 32
  rank_step: 2
  score_mode: output_normalized
  alpha_ratio: 2.0
experiment_name: adalora_avg4_output_normalized
