experiment:
  method: lora
model_key: qwen3_8b
models:
  qwen3_1p7b:
    model_name: Qwen/Qwen3-1.7B
    model_short_name: qwen3_1p7b
  qwen3_4b:
    model_name: Qwen/Qwen3-4B
    model_short_name: qwen3_4b
  qwen3_8b:
    model_name: Qwen/Qwen3-8B
    model_short_name: qwen3_8b
model:
  model_name: Qwen/Qwen3-8B
  model_short_name: qwen3_8b
  torch_dtype: bfloat16
  trust_remote_code: true
output:
  model_output_dir: src/outputs/qwen3_8b
dataset:
  dataset_name: openai/gsm8k
  dataset_config: main
  split: train
  max_train_samples: 2000
quantization:
  load_in_4bit: false
  bnb_4bit_quant_type: nf4
  bnb_4bit_compute_dtype: bfloat16
  bnb_4bit_use_double_quant: true
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
training:
  output_dir: src/outputs/qwen3_8b/lora_r16
  num_train_epochs: 2
  learning_rate: 4.0e-05
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  max_seq_length: 1024
  logging_steps: 10
  save_strategy: epoch
  seed: 42
  bf16: true
  fp16: false
evaluation:
  split: test
  max_eval_samples: 400
  max_new_tokens: 128
  temperature: 0.0
  do_sample: false
experiment_name: qwen3_8b_lora_r16
