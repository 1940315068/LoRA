experiment:
  model_tag: qwen3_4b
  method: lora
model:
  model_name: Qwen/Qwen3-4B
  model_short_name: qwen3_4b
  torch_dtype: bfloat16
  trust_remote_code: true
output:
  model_output_dir: src/outputs/qwen3_4b
dataset:
  dataset_name: openai/gsm8k
  dataset_config: main
  split: train
  max_train_samples: 2000
lora:
  r: 64
  alpha: 128
  dropout: 0.05
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
training:
  output_dir: src/outputs/qwen3_4b/lora_r64
  num_train_epochs: 2
  learning_rate: 0.0002
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  max_seq_length: 1024
  logging_steps: 10
  save_strategy: epoch
  seed: 42
  bf16: true
  fp16: false
evaluation:
  split: test
  max_eval_samples: 400
  max_new_tokens: 128
  temperature: 0.0
  do_sample: false
experiment_name: qwen3_4b_lora_r64
