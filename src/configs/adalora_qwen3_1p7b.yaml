experiment:
  method: adalora          # Uses static per-module rank allocation (no PEFT AdaLoRA).

model:
  model_name: Qwen/Qwen3-1.7B
  model_short_name: qwen3_1p7b
  torch_dtype: bfloat16
  trust_remote_code: true

output:
  model_output_dir: src/outputs/qwen3_1p7b

dataset:
  dataset_name: openai/gsm8k
  dataset_config: main
  split: train
  max_train_samples: 2000

lora:
  r: 16               # Fallback / avg rank; overridden per-module by rank_pattern.
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj

training:
  output_dir: null    # Set automatically by train.py from the run name.
  num_train_epochs: 2
  learning_rate: 2.0e-4
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  max_seq_length: 1024
  logging_steps: 10
  save_strategy: epoch
  seed: 42
  bf16: true
  fp16: false

evaluation:
  split: test
  max_eval_samples: 100
  max_new_tokens: 128
  temperature: 0.0
  do_sample: false

# Gradient importance analysis settings (used by compute_gradient_importance.py).
gradient_importance:
  max_calibration_samples: 64
  max_seq_length: 512
  max_spectral_rank: 64
  svd_niter: 4

# Rank allocation settings (used by create_adalora_rank_config.py).
adaptive_rank:
  avg_rank: 16
  min_rank: 2
  max_rank: 32
  rank_step: 2
  score_mode: output_normalized
  alpha_ratio: 2.0
