experiment:
  model_tag: qwen3_1p7b
  method: adalora

model:
  model_name: Qwen/Qwen3-1.7B
  model_short_name: qwen3_1p7b
  torch_dtype: bfloat16
  trust_remote_code: true

output:
  model_output_dir: src/outputs/qwen3_1p7b

dataset:
  dataset_name: openai/gsm8k
  dataset_config: main
  split: train
  max_train_samples: 2000

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj

adalora:
  init_r: 32
  tinit: 200
  tfinal: 200
  deltaT: 10
  beta1: 0.85
  beta2: 0.85
  orth_reg_weight: 0.5
  total_step: 0

training:
  output_dir: null
  num_train_epochs: 2
  learning_rate: 2.0e-4
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  max_seq_length: 1024
  logging_steps: 10
  save_strategy: epoch
  seed: 42
  bf16: true
  fp16: false

evaluation:
  split: test
  max_eval_samples: 100
  max_new_tokens: 128
  temperature: 0.0
  do_sample: false
