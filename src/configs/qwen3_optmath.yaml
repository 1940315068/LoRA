experiment:
  method: lora

model_key: qwen3_1p7b

models:
  qwen3_1p7b:
    model_name: Qwen/Qwen3-1.7B
    model_short_name: qwen3_1p7b

  qwen3_4b:
    model_name: Qwen/Qwen3-4B
    model_short_name: qwen3_4b

  qwen3_8b:
    model_name: Qwen/Qwen3-8B
    model_short_name: qwen3_8b

model:
  model_name: null
  model_short_name: null
  torch_dtype: bfloat16
  trust_remote_code: true

output:
  model_output_dir: null

dataset:
  task: optmath
  dataset_name: Aurora-Gem/OptMATH-Train
  dataset_config: null
  split: train
  max_train_samples: 4000

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj

training:
  output_dir: null
  num_train_epochs: 2
  learning_rate: 1.0e-4
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  max_seq_length: 2048
  logging_steps: 10
  save_strategy: epoch
  seed: 42
  bf16: true
  fp16: false

evaluation:
  split: train
  max_eval_samples: 100
  max_new_tokens: 2048
  max_input_length: 4096
  temperature: 0.0
  do_sample: false
  execution_timeout: 100
  numerical_tolerance: 0.05

quantization_analysis:
  max_calibration_samples: 64
  max_seq_length: 1024
  max_tokens_per_sample: 128

  max_spectral_rank: 64
  svd_niter: 2

adaptive_rank:
  avg_rank: 16
  min_rank: 2
  max_rank: 32

  # Recommended:
  # Each gain is normalized by the layer output energy.
  score_mode: output_normalized

  alpha_ratio: 2.0